name: Update FEMA Disaster Aid Total

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of every month at 06:00 UTC
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download FEMA CSVs and calculate 2000-present aid total
        id: calc
        run: |
          python3 - <<'EOF'
          import csv, urllib.request, os

          urllib.request.urlretrieve(
              'https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries.csv',
              'decl.csv'
          )
          urllib.request.urlretrieve(
              'https://www.fema.gov/api/open/v1/FemaWebDisasterSummaries.csv',
              'costs.csv'
          )

          # Build disaster-number → fiscal year map
          decl_years = {}
          with open('decl.csv') as f:
              for row in csv.DictReader(f):
                  dn = row['disasterNumber'].strip()
                  try:
                      yr = int(row['fyDeclared'].strip())
                      if dn not in decl_years:
                          decl_years[dn] = yr
                  except ValueError:
                      pass

          # Sum spending fields for disasters declared 2000-present
          fields = [
              'totalAmountIhpApproved', 'totalAmountHaApproved',
              'totalAmountOnaApproved', 'totalObligatedAmountPa',
              'totalObligatedAmountHmgp',
          ]
          total = 0
          with open('costs.csv') as f:
              for row in csv.DictReader(f):
                  dn = row['disasterNumber'].strip()
                  if decl_years.get(dn, 0) < 2000:
                      continue
                  for field in fields:
                      v = row.get(field, '').strip()
                      if v:
                          try:
                              total += float(v)
                          except ValueError:
                              pass

          print(f'total={int(total)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'total={int(total)}\n')
          EOF

      - name: Update FEMA_TOTAL_AID in docs/index.html
        run: |
          NEW=${{ steps.calc.outputs.total }}
          sed -i "s/const FEMA_TOTAL_AID = [0-9]*/const FEMA_TOTAL_AID = ${NEW}/" docs/index.html
          echo "Updated FEMA_TOTAL_AID to ${NEW}"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No change in aid total — skipping commit"
          else
            NEW=${{ steps.calc.outputs.total }}
            BILLIONS=$(python3 -c "print(f'{${NEW}/1e9:.1f}')")
            git commit -m "chore: update FEMA total aid to \$${BILLIONS}B"
            git push
          fi
